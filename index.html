<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.sakura_moti - Profile</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <!-- Hero Section -->
        <section class="profile-card fade-in">
            <div class="avatar-container">
                <img src="./assets/avatar.png" alt=".sakura_moti avatar" class="avatar" id="profile-image">
                <label for="avatar-upload" class="upload-btn" title="画像をアップロードして変更">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </label>
                <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
            </div>
            
            <h1 class="name">.sakura_moti</h1>
            <p class="subtitle">Welcome to my portfolio!</p>

            <div class="tags">
                <div class="tag">
                    <span class="tag-label">得意なこと</span>
                    <span class="tag-value">ゲーム 🎮</span>
                </div>
                <div class="tag">
                    <span class="tag-label">興味があること</span>
                    <span class="tag-value">自分がまだやった事がない事 ✨</span>
                </div>
            </div>
        </section>

        <!-- Sections -->
        <div class="content-grid">
            <section class="info-card slide-up">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
                </div>
                <h2>自分にとってAIとは？</h2>
                <p>サポーターのような存在です。</p>
            </section>

            <section class="info-card slide-up" style="transition-delay: 100ms;">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                </div>
                <h2>今後AIとどう向き合いたいか？</h2>
                <p>自身の成長の助けになるように向き合いたいです。</p>
            </section>

            <section class="info-card challenge-card slide-up" style="transition-delay: 200ms;">
                <div class="card-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
                <h2>この授業での挑戦</h2>
                <p>自分がまだ知らない興味をもちそうなことを調べて、そのことについて探求してみたいです。</p>
            </section>
        </div>
    </main>

    <footer class="footer fade-in">
        <p>&copy; 2026 .sakura_moti. Designed with 🩵.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
